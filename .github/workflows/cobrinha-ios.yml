name: Gerar Cobrinha 3310 para iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar jogo e preparar interface
        run: |
          npm run verify
          npm run build
          npx cap sync ios
      - name: Compilar para iPhone sem assinatura Apple
        run: node scripts/build-ios-unsigned.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Cobrinha-3310-iPhone-sem-assinatura
          path: native-app/build/Cobrinha-3310-sem-assinatura.ipa
          if-no-files-found: error
          retention-days: 7
